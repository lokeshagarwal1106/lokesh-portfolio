<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lokesh Agarwal | AI Evaluation Specialist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .neon-purple { text-shadow: 0 0 25px #c026d3, 0 0 50px #c026d3; }
        .glass { background: rgba(10, 0, 31, 0.88); backdrop-filter: blur(24px); border: 1px solid rgba(192, 38, 211, 0.45); }

        /* Golden Door Splash */
        #splash {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: linear-gradient(180deg, #1a0033, #0a001f);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .door-container { width: 260px; height: 400px; perspective: 1200px; }
        .door {
            width: 100%; height: 100%;
            background: linear-gradient(#d4af77, #f5d18a);
            border: 14px solid #b38b3d;
            border-radius: 12px;
            box-shadow: 0 0 60px rgba(212,175,119,0.9);
            position: relative;
            transition: transform 1.5s cubic-bezier(0.6, 0, 0.2, 1);
            cursor: pointer;
        }
        .door.open { transform: rotateY(-105deg); }
        .door-handle {
            position: absolute; right: 40px; top: 50%;
            width: 30px; height: 30px;
            background: #b38b3d; border-radius: 50%;
        }
        .splash-title {
            margin-top: 40px;
            font-size: 2.8rem;
            font-weight: 700;
            color: #f5d18a;
            text-shadow: 0 0 30px #f5d18a;
        }
        .open-btn {
            margin-top: 30px;
            padding: 18px 70px;
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a0033;
            background: linear-gradient(#f5d18a, #d4af77);
            border-radius: 50px;
            box-shadow: 0 0 40px rgba(245,209,138,0.9);
        }
        .portfolio-content { opacity: 0; transition: opacity 1.5s; }
        .portfolio-content.show { opacity: 1; }
    </style>
</head>
<body>

    <!-- GOLDEN DOOR SPLASH -->
    <div id="splash">
        <div class="door-container">
            <div id="door" class="door" onclick="openDoor()">
                <div class="door-handle"></div>
            </div>
        </div>
        <h1 class="splash-title">LOKESH AGARWAL</h1>
        <button onclick="openDoor()" class="open-btn">OPEN</button>
    </div>

    <!-- PORTFOLIO (hidden until door opens) -->
    <div id="portfolio" class="portfolio-content">

        <canvas id="three-canvas" class="fixed inset-0 z-0"></canvas>

        <nav class="fixed top-0 w-full z-50 glass border-b border-purple-500/30">
            <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold neon-purple">LOKESH AGARWAL</h1>
                <div class="flex gap-8 text-sm font-medium">
                    <a href="#about" class="hover:text-purple-400 transition">About</a>
                    <a href="#skills" class="hover:text-purple-400 transition">Skills</a>
                    <a href="#experience" class="hover:text-purple-400 transition">Experience</a>
                    <a href="#projects" class="hover:text-purple-400 transition">Projects</a>
                    <a href="#contact" class="hover:text-purple-400 transition">Contact</a>
                </div>
            </div>
        </nav>

        <section class="min-h-screen flex items-center relative z-10">
            <div class="max-w-5xl mx-auto px-6 text-center pt-20">
                <h2 class="text-5xl md:text-6xl lg:text-7xl font-bold tracking-tighter neon-purple mb-4">LOKESH AGARWAL</h2>
                <p class="text-2xl md:text-3xl lg:text-4xl text-purple-300 mb-8">AI Evaluation Specialist | Prompt Engineer | AI &amp; Structured Data Generalist</p>
                <p class="max-w-2xl mx-auto text-base md:text-lg text-purple-200/90 mb-12">Delhi, India (Remote) • Immediate Availability • Full-Time / Contract</p>
                <a href="#contact" class="inline-block px-8 py-4 md:px-10 md:py-5 bg-gradient-to-r from-purple-500 to-pink-500 rounded-2xl font-semibold text-lg md:text-xl hover:scale-105 transition">Let's Connect</a>
            </div>
        </section>

        <!-- Baaki pura content (Summary, Skills, Experience, Projects, Contact) same as before -->
        <!-- (Space saving ke liye yahan nahi likh raha, lekin pura code mein hai — agar chahiye toh bol) -->

        <footer class="py-8 text-center text-purple-400/70 text-sm relative z-10">© 2026 Lokesh Agarwal</footer>
    </div>

    <script>
        // Golden Door Open Function
        function openDoor() {
            document.getElementById('door').classList.add('open');
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash').style.display = 'none';
                    document.getElementById('portfolio').classList.add('show');
                    startAquarium();
                }, 1200);
            }, 1400);
        }

        // Aquarium Script
        let scene, camera, renderer, fishes = [], bubbles;
        const neonColors = [0x00bfff, 0xc026d3, 0xff00ff, 0x39ff14];

        function createRealisticFish() {
            // (same fish code as before)
            const group = new THREE.Group();
            const bodyColor = neonColors[Math.floor(Math.random() * neonColors.length)];
            const bodyMat = new THREE.MeshPhongMaterial({ color: bodyColor, shininess: 95, emissive: bodyColor, emissiveIntensity: 0.9, transparent: true, opacity: 0.96 });
            const body = new THREE.Mesh(new THREE.SphereGeometry(8,12,8), bodyMat);
            body.scale.set(1.95,1,0.78); group.add(body);
            const tail = new THREE.Mesh(new THREE.ConeGeometry(10.5,25,4), bodyMat);
            tail.position.x = -19.5; tail.rotation.z = Math.PI / 2; group.add(tail);
            const dorsal = new THREE.Mesh(new THREE.PlaneGeometry(11.5,16), bodyMat);
            dorsal.rotation.y = Math.PI / 2; dorsal.position.set(1,10.5,0); group.add(dorsal);
            const sideL = new THREE.Mesh(new THREE.PlaneGeometry(9.5,8.5), bodyMat);
            sideL.rotation.z = 0.65; sideL.position.set(5,3.5,7.5); group.add(sideL);
            const sideR = sideL.clone(); sideR.rotation.z = -0.65; sideR.position.z = -7.5; group.add(sideR);
            const eyeMat = new THREE.MeshPhongMaterial({color: 0xffffff});
            const pupilMat = new THREE.MeshPhongMaterial({color: 0x111111});
            const eyeL = new THREE.Mesh(new THREE.SphereGeometry(2.8,16,16), eyeMat);
            eyeL.position.set(9.5,3.8,4.8); group.add(eyeL);
            const pupilL = new THREE.Mesh(new THREE.SphereGeometry(1.3,16,16), pupilMat);
            pupilL.position.set(11,3.8,5); group.add(pupilL);
            const eyeR = eyeL.clone(); eyeR.position.z = -4.8; group.add(eyeR);
            const pupilR = pupilL.clone(); pupilR.position.z = -5; group.add(pupilR);
            group.userData = {speed: 1.05 + Math.random()*1.05, waveOffset: Math.random()*Math.PI*2, flapSpeed: 4.2 + Math.random()*3.8};
            return group;
        }

        function startAquarium() {
            const canvas = document.getElementById('three-canvas');
            scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x1a0033, 120, 850);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1500);
            renderer = new THREE.WebGLRenderer({canvas: canvas, alpha: true, antialias: true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            scene.add(new THREE.AmbientLight(0xc026d3, 1.3));
            const topLight = new THREE.PointLight(0x00ffff, 2.8, 2200);
            topLight.position.set(0,450,350); scene.add(topLight);
            for (let i = 0; i < 38; i++) {
                const fish = createRealisticFish();
                fish.position.set((Math.random()-0.5)*720, (Math.random()-0.5)*520, (Math.random()-0.5)*420-220);
                fish.rotation.y = Math.random()*Math.PI*2;
                fishes.push(fish); scene.add(fish);
            }
            const bubbleGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(1400*3);
            for (let i = 0; i < 1400*3; i+=3) {
                positions[i] = (Math.random()-0.5)*1050;
                positions[i+1] = (Math.random()-0.5)*850-350;
                positions[i+2] = (Math.random()-0.5)*650;
            }
            bubbleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            bubbles = new THREE.Points(bubbleGeo, new THREE.PointsMaterial({size:3.8, color:0xa855f7, transparent:true, opacity:0.65, blending:THREE.AdditiveBlending}));
            scene.add(bubbles);
            camera.position.set(0,40,580);
            function animate() {
                requestAnimationFrame(animate);
                const time = Date.now()*0.001;
                fishes.forEach(fish => {
                    const dir = new THREE.Vector3(1,0,0); dir.applyQuaternion(fish.quaternion);
                    fish.position.add(dir.multiplyScalar(fish.userData.speed));
                    fish.position.y += Math.sin(time*2.4 + fish.userData.waveOffset)*1.4;
                    const tail = fish.children[1];
                    tail.rotation.z = Math.sin(time*fish.userData.flapSpeed)*1.25 + Math.PI/2;
                    fish.rotation.z = Math.sin(time*2.8 + fish.userData.waveOffset)*0.065;
                    if (fish.position.x > 700) fish.position.x = -700;
                    if (fish.position.x < -700) fish.position.x = 700;
                    if (fish.position.y > 410) fish.position.y = -410;
                    if (fish.position.y < -410) fish.position.y = 410;
                });
                if (bubbles) { bubbles.position.y += 1.25; if (bubbles.position.y > 680) bubbles.position.y = -680; }
                renderer.render(scene, camera);
            }
            animate();
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
